<app-layout-shell [sidebarVisible]="sidebarVisible()" (closeSidebar)="closeSidebar()">
  <app-sidebar slot="sidebar" [menuItems]="menuItems" [user]="sidebarUser()" [collapsed]="false" (navigate)="onMenuItemClick($event)"></app-sidebar>
  <app-topbar slot="topbar" [title]="'Dashboard'" [userInitials]="userInitials()"
    [userName]="currentUser()?.name || 'Usuario'" [userEmail]="currentUser()?.email || 'usuario@email.com'"
    [notificationCount]="3" (toggleSidebar)="toggleSidebar()" (userAction)="onUserAction($any($event))"
    (logout)="onLogout()">
    <app-theme-switcher></app-theme-switcher>
  </app-topbar>

  <app-pagina-dashboard
    [titulo]="'Bienvenido de nuevo, ' + ((currentUser()?.name ?? 'Usuario').split(' ')[0]) + ' 👋'"
    subtitulo="Aquí tienes el resumen ejecutivo de hoy. Todo funcionando al 100%."
    [metricas]="metrics()"
    [cargando]="statsApi.loading()"
    [error]="statsApi.error()">
    
    <ng-container dashboard-acciones>
      <app-row gap="1rem">
        <app-button variant="outline" iconClass="fa-solid fa-download">Reporte Mensual</app-button>
        <app-button variant="primary" iconClass="fa-solid fa-plus">Nuevo Proyecto</app-button>
      </app-row>
    </ng-container>

    <ng-container dashboard-contenido>
      <app-row columns="1fr 1fr" gap="1.5rem">
        <app-panel title="Últimas Transacciones">
          <app-summary-list [items]="recentTransactions"></app-summary-list>
        </app-panel>
        <app-panel title="Actividad Reciente">
          <app-summary-list [items]="activityFeed"></app-summary-list>
        </app-panel>
      </app-row>
    </ng-container>

  </app-pagina-dashboard>
</app-layout-shell>
