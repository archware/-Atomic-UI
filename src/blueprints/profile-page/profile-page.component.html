<app-layout-shell [sidebarVisible]="sidebarVisible()" (closeSidebar)="sidebarVisible.set(false)">

  <!-- Sidebar -->
  <app-sidebar slot="sidebar" [menuItems]="menuItems" logoText="CxC Ventas" logoIcon="fa-solid fa-sack-dollar" logoIconColor="var(--purple-500)" logoTextColor="var(--text-color)" headerBgColor="var(--surface-sunken)" footerBgColor="var(--surface-sunken)" [user]="{ name: 'Usuario Demo', role: 'Administrador', initials: 'UD' }" (navigate)="onNavigate($event)"></app-sidebar>

  <!-- Topbar -->
  <app-topbar [showHomeButton]="true" apiStatus="API en línea" [showUserInfo]="false" [showSidebarToggle]="true"
    slot="topbar"
    title="Mi Perfil"
    [userInitials]="(currentUser?.names ?? 'U')[0]"
    [userName]="currentUser?.names ?? 'Usuario'"
    [userEmail]="currentUser?.email ?? ''"
    (toggleSidebar)="onToggleSidebar()"
    (logout)="logout()"
  >
    <app-theme-switcher></app-theme-switcher>
  </app-topbar>

  <!-- Contenido principal -->
  <div class="flex justify-center p-6 mt-8">
    <div class="w-full max-w-md">
      <!-- Resumen de cuenta -->
      <app-panel variant="elevated" padding="none">
        <app-profile-cover 
          [loading]="profileApi.loading()"
          [initials]="(currentUser?.names ?? 'U')[0]"
          [firstName]="profileApi.data()?.firstName ?? ''"
          [lastName]="profileApi.data()?.lastName ?? ''"
          [role]="profileApi.data()?.role ?? 'Usuario'">
        </app-profile-cover>

        <div class="p-6">
          <app-divider></app-divider>
          <div class="flex flex-col gap-3 mt-4">
            <div class="flex flex-col gap-1">
              <app-text variant="label" color="muted">Email</app-text>
              <app-text variant="body-sm">{{ profileApi.data()?.email ?? '' }}</app-text>
            </div>
            <div class="flex flex-col gap-1">
              <app-text variant="label" color="muted">Teléfono</app-text>
              <app-text variant="body-sm">{{ profileApi.data()?.phone ?? 'No registrado' }}</app-text>
            </div>
          </div>
          <div class="mt-6">
            <app-button type="button" variant="primary" (click)="goToSettings()" class="w-full">
              <i class="fa-solid fa-user-pen mr-2"></i> Editar perfil
            </app-button>
          </div>
        </div>
      </app-panel>
    </div>
  </div>

</app-layout-shell>
