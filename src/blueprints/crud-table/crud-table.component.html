<app-layout-shell [sidebarVisible]="sidebarVisible()" (closeSidebar)="sidebarVisible.set(false)">
  <!-- Sidebar Slot -->
  <app-sidebar ngProjectAs="[slot=sidebar]" slot="sidebar" [menuItems]="menuItems" logoText="CxC Ventas" logoIcon="fa-solid fa-sack-dollar" logoIconColor="var(--purple-500)" logoTextColor="var(--text-color)" headerBgColor="var(--surface-sunken)" footerBgColor="var(--surface-sunken)" [user]="{ name: 'Usuario Demo', role: 'Administrador', initials: 'UD' }" (navigate)="onSidebarNavigate($event)"></app-sidebar>

  <!-- Topbar Slot -->
  <app-topbar ngProjectAs="[slot=topbar]" [showHomeButton]="true" apiStatus="API en línea" [showSidebarToggle]="true" slot="topbar" [title]="'Gestión de Usuarios'" [userInitials]="'HC'" [userName]="'COTAHA'"
    [userEmail]="'cotaha@email.com'" [notificationCount]="3" (toggleSidebar)="onToggleSidebar()" (userAction)="onUserAction($any($event))" (logout)="onLogout()">
    <app-theme-switcher></app-theme-switcher>
  </app-topbar>

  <app-pagina-crud
    titulo="Usuarios"
    [columnas]="columnas"
    [filas]="filas()"
    [estado]="estadoGrilla()"
    [totalRegistros]="totalRegistros()"
    [paginaActual]="paginaActual()"
    [guardando]="saveApi.loading()"
    [errorOperacion]="saveApi.error()?.message ?? null"
    [opcionesBusqueda]="opcionesBusqueda"
    [modoCrud]="modoCrud()"
    [entidadActiva]="entidadActiva()"
    [acciones]="{ ver: true, editar: true, eliminar: true }"
    (alSolicitarPagina)="cargarPagina($event)"
    (alCrear)="abrirCrear()"
    (alEditar)="abrirEditar($event)"
    (alVer)="abrirVer($event)"
    (alEliminar)="eliminar($event)"
    (alGuardar)="guardar()"
    (alCerrarDialogo)="cerrarDialogo()"
    (alReintentar)="cargarPagina({ pagina: 1, tamano: 10, busqueda: '' })"
  >
    <ng-template #formularioCrud let-ctx>
      <form [formGroup]="entityForm" style="display: flex; flex-direction: column; gap: 1rem;">
        <app-floating-input 
          label="Nombre" 
          formControlName="name" 
          iconClass="fa-solid fa-user" 
          [error]="getFieldError('name')">
        </app-floating-input>

        <app-floating-input 
          label="Email" 
          type="email" 
          formControlName="email" 
          iconClass="fa-solid fa-envelope"
          [error]="getFieldError('email')">
        </app-floating-input>

        <app-select2 
          label="Rol" 
          [options]="roleOptions" 
          formControlName="role">
        </app-select2>

        <app-select2 
          label="Estado" 
          [options]="statusOptions" 
          formControlName="status">
        </app-select2>
      </form>
    </ng-template>
  </app-pagina-crud>
</app-layout-shell>
