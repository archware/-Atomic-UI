<div class="topbar-container" [appVariablesCss]="{'--surface-background': bgColor() || null}">
  <div class="topbar-left">
    <div class="sidebar-toggle-wrapper">
      @if (showSidebarToggle()) {
        <app-icon-button variant="ghost" animation="none" tooltip="Menú" (clicked)="toggleSidebar.emit()">
          <i class="fa-solid fa-bars topbar-icon" aria-hidden="true"></i>
        </app-icon-button>
      }
    </div>

    @if (showHomeButton()) {
      <app-icon-button variant="ghost" animation="grow" tooltip="Inicio" (clicked)="homeClick.emit()">
        <i class="fa-regular fa-house topbar-icon" aria-hidden="true"></i>
      </app-icon-button>
    }

    <div class="topbar-title-area">
      <h1 class="page-title">{{ title() }}</h1>
      @if (subtitle() || apiStatus()) {
        <div class="topbar-subtitle-row">
          @if (subtitle()) {
            <span class="page-subtitle">{{ subtitle() }}</span>
          }
          @if (apiStatus()) {
            <span class="api-status-badge" [class]="'badge-' + apiStatusColor()">
              <i class="fa-solid fa-circle status-dot"></i> {{ apiStatus() }}
            </span>
          }
        </div>
      }
    </div>
  </div>

  <div class="topbar-right">
    @if (showLanguageSwitcher()) {
      <app-language-switcher></app-language-switcher>
    }
    <ng-content></ng-content>
    @if (showNotifications()) {
      <app-icon-button variant="ghost" animation="grow" tooltip="Notificaciones" [badge]="notificationCount()" (clicked)="notificationClick.emit()">
        <i class="fa-regular fa-bell topbar-icon" aria-hidden="true"></i>
      </app-icon-button>
    }
    <app-user-menu
      [initials]="userInitials()"
      [userName]="userName()"
      [userEmail]="userEmail()"
      [userRole]="userRole()"
      [avatarColor]="avatarColor()"
      [showUserInfo]="showUserInfo()"
      (actionSelected)="onUserAction($event)"
      (logout)="onLogout()"
    ></app-user-menu>
  </div>
</div>
