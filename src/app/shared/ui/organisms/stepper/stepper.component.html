<nav class="stepper" [class.stepper--vertical]="vertical()" [attr.aria-label]="accessibleLabel()">
  <ol class="stepper__list">
    @for (step of steps(); track $index; let index = $index) {
      <li
        class="stepper__item"
        [class.stepper__item--active]="isActive(index)"
        [class.stepper__item--completed]="isCompleted(index)"
        [class.stepper__item--disabled]="isStepDisabled(index)"
      >
        <button
          class="stepper__button"
          type="button"
          [id]="stepId(step, index)"
          [attr.aria-controls]="panelId(step, index)"
          [attr.aria-current]="isActive(index) ? 'step' : null"
          [disabled]="isStepDisabled(index)"
          (click)="selectStep(index)"
        >
          <span class="stepper__indicator" aria-hidden="true">
            @if (isCompleted(index)) {
              <span class="stepper__check">&#10003;</span>
            } @else {
              {{ index + 1 }}
            }
          </span>
          <span class="stepper__content">
            <span class="stepper__label">{{ step.label }}</span>
            @if (step.description) {
              <span class="stepper__description">{{ step.description }}</span>
            }
            <span class="visually-hidden">{{ statusText(index) }}</span>
          </span>
        </button>
      </li>
    }
  </ol>
</nav>
