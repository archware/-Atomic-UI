<dialog
  #nativeDialog
  class="crud-dialog crud-dialog--{{ size() }} {{ panelClass() }}"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-describedby]="describedBy()"
  (cancel)="handleCancel($event)"
  (close)="handleClosed()"
>
  <!-- Los selectores delegaban el scroll al div envoltorio inmediato, que es
       exactamente lo que ya es el viewport propio del componente. -->
  <app-scroll-overlay
    class="crud-dialog__viewport"
    [horizontal]="false"
    [fill]="true"
  >
    <div #scrollSurface class="crud-dialog__surface" data-crud-dialog-scroll-surface>
      <ng-content />
    </div>
  </app-scroll-overlay>
</dialog>
