<!--
  Chasis C — Página de detalle con pestañas.

  Composición:
    PageHeader (con botón Volver) → Resumen (opcional) → Tabs → Contenido
-->

<!-- ═══════════════════════════════════════════════════════════
     CABECERA DE PÁGINA CON ACCIÓN DE RETORNO
     ═══════════════════════════════════════════════════════════ -->
<app-page-header
  [title]="titulo()"
  [subtitle]="subtitulo()"
  [eyebrow]="eyebrow()"
  [align]="headerAlign()"
>
  @if (mostrarBotonVolver()) {
    <div page-header-actions>
      <app-button
        variant="outline"
        [icon]="iconoVolver()"
        (buttonClick)="alVolver.emit()"
      >
        {{ etiquetaVolver() }}
      </app-button>
    </div>
  }
</app-page-header>

<!-- ═══════════════════════════════════════════════════════════
     RESUMEN SUPERIOR (KPIs, métricas clave)
     Proyectado opcionalmente por el consumidor.
     ═══════════════════════════════════════════════════════════ -->
@for (tpl of resumen(); track $index) {
  <section class="pagina-detalle__resumen">
    <ng-container [ngTemplateOutlet]="tpl" />
  </section>
}

<!-- ═══════════════════════════════════════════════════════════
     PESTAÑAS
     Cada pestaña se genera desde la configuración PestanaDetalle[].
     El contenido se proyecta usando <ng-template #pestana>.
     ═══════════════════════════════════════════════════════════ -->
<app-tabs [defaultIndex]="defaultTabIndex()" (tabChange)="alSeleccionarPestana($event)">
  @for (p of pestanas(); track p.clave) {
    <app-tab
      [label]="p.titulo"
      [iconClass]="p.icono ?? ''"
      [disabled]="p.deshabilitada ?? false"
    >
      <!-- El contenido de la pestaña se proyecta desde el consumidor -->
      @for (tpl of contenidoPestana(); track $index) {
        <ng-container
          [ngTemplateOutlet]="tpl"
          [ngTemplateOutletContext]="contextoPestana(p.clave)"
        />
      }
    </app-tab>
  }
</app-tabs>
