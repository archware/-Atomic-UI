<app-tabs [defaultIndex]="defaultTabIndex()" (tabChange)="alSeleccionarPestana($event)">
  @for (p of pestanas(); track p.clave) {
    <app-tab
      [label]="p.titulo"
      [iconClass]="p.icono ?? ''"
      [disabled]="p.deshabilitada ?? false"
    >
      <!-- El contenido de la pestaÃ±a se proyecta desde el consumidor -->
      @for (tpl of contenidoPestana(); track $index) {
        <ng-container
          [ngTemplateOutlet]="tpl"
          [ngTemplateOutletContext]="contextoPestana(p.clave)"
        />
      }
    </app-tab>
  }
</app-tabs>
