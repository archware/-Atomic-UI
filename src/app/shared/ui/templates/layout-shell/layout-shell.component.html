<div class="layout-shell" [class.sidebar-hidden]="!sidebarVisible" [style.--sidebar-width]="sidebarWidth">
  <!--
    Enlace de salto. Invisible hasta que recibe el foco, y entonces es lo
    primero que encuentra quien navega con teclado: sin él, llegar al contenido
    obliga a recorrer el menú entero en cada carga de página.
  -->
  <a class="layout-skip-link" href="#layout-main-content">{{ skipLinkLabel }}</a>

  <!-- Sidebar Slot -->
  <aside class="layout-sidebar" [class.active]="sidebarVisible" [attr.aria-label]="sidebarLabel"
    [attr.aria-hidden]="sidebarVisible ? null : 'true'" [attr.inert]="sidebarInert">
    <ng-content select="[slot=sidebar]"></ng-content>
  </aside>

  <!-- Mobile Overlay -->
  <div class="layout-overlay" [class.active]="sidebarVisible" (click)="onOverlayClick()"
    (keydown.escape)="onOverlayClick()" tabindex="-1" role="presentation"></div>

  <!-- Topbar Slot -->
  <header class="layout-header" [attr.inert]="contentInert">
    <ng-content select="[slot=topbar]"></ng-content>
  </header>

  <!--
    `tabindex="-1"` lo hace destino de foco sin meterlo en el orden de
    tabulación: es lo que permite que el enlace de salto lleve el foco de
    verdad y no solo desplace la página.
  -->
  <main #mainContent id="layout-main-content" class="layout-content" tabindex="-1" [attr.inert]="contentInert">
    <app-scroll-overlay class="so-block h-full w-full" [skipTableDetection]="true">
      <div class="content-wrapper">
        <ng-content></ng-content>
      </div>
    </app-scroll-overlay>
  </main>

  @if (footerVisible) {
    <div class="layout-footer" [attr.inert]="contentInert">
      <app-footer
        variant="inline"
        [companyName]="footerCompanyName"
        [year]="footerYear"
        [copyrightText]="footerCopyrightText"
        [showVersion]="footerShowVersion"
        [version]="footerVersion"
        [environment]="footerEnvironment"
        [showBuildDate]="false">
      </app-footer>
    </div>
  }
</div>
