@switch (renderAs()) {
  @case ('h1') { <h1 [class]="classes()"><ng-container [ngTemplateOutlet]="content"></ng-container></h1> }
  @case ('h2') { <h2 [class]="classes()"><ng-container [ngTemplateOutlet]="content"></ng-container></h2> }
  @case ('h3') { <h3 [class]="classes()"><ng-container [ngTemplateOutlet]="content"></ng-container></h3> }
  @case ('h4') { <h4 [class]="classes()"><ng-container [ngTemplateOutlet]="content"></ng-container></h4> }
  @default { <p [class]="classes()"><ng-container [ngTemplateOutlet]="content"></ng-container></p> }
}
<ng-template #content><ng-content></ng-content></ng-template>
