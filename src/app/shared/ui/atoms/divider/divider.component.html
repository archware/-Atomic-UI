<div class="divider"
         [class.divider--vertical]="orientation() === 'vertical'"
         [class.divider--light]="variant() === 'light'"
         [class.divider--strong]="variant() === 'strong'"
         [class.divider--dashed]="variant() === 'dashed'"
         role="separator">
      @if (label() || text()) {
        <span class="divider-text">{{ label() || text() }}</span>
      }
    </div>
