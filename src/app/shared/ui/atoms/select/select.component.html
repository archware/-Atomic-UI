<div
  class="fl-field field"
  [class.fl-field--floating]="flotante()"
  [class.field--error]="error()"
>
  @if (tieneEtiqueta() && !flotante()) {
    <label class="fl-label" [for]="id()">
      {{ label() }}
      @if (required()) {
        <span class="field__required" aria-hidden="true">*</span>
      }
    </label>
  }
  <div class="fl-control field__control">
    <select
      #nativeSelect
      class="field__select"
      [class.field__select--resting]="marcadorOculto()"
      [id]="id()"
      [disabled]="effectiveDisabled()"
      [required]="required()"
      [attr.aria-label]="ariaLabel() ?? (label() ? null : placeholder())"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="descritoPor()"
      (change)="handleChange($event)"
      (focus)="handleFocus()"
      (blur)="handleBlur()"
    >
      @if (placeholder()) {
        <option value="" [disabled]="required()" [selected]="value() === ''">
          {{ placeholder() }}
        </option>
      }
      @if (legacyOption(); as legacyOption) {
        <option [value]="legacyOption.value" selected>{{ legacyOption.label | translate }}</option>
      }
      @for (option of options(); track option.value) {
        <option
          [value]="option.value"
          [disabled]="option.disabled ?? false"
          [selected]="value() === option.value.toString()"
        >
          {{ option.label | translate }}
        </option>
      }
    </select>
    @if (flotante()) {
      <label
        class="fl-label fl-label--floating"
        [class.fl-label--floated]="elevada()"
        [class.fl-label--error]="error()"
        [class.fl-label--disabled]="effectiveDisabled()"
        [for]="id()"
      >
        {{ label() }}
        @if (required()) {
          <span class="field__required" aria-hidden="true">*</span>
        }
      </label>
    }
    <svg class="field__arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="m3 6 5 5 5-5" />
    </svg>
  </div>
  @if (error()) {
    <app-form-error [customMessage]="error() ?? undefined" [messageId]="id() + '-error'" />
  } @else if (hint()) {
    <span class="field__message" [id]="id() + '-hint'">{{ hint() }}</span>
  }
</div>
