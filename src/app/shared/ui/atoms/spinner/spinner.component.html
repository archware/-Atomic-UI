<span
      class="spinner"
      [class]="'spinner--' + size() + ' spinner--' + variant()"
      [attr.role]="'status'"
      [attr.aria-label]="label()"
      [attr.aria-live]="'polite'"
    >
      <span class="spinner__ring"></span>
      <span class="visually-hidden">{{ label() }}</span>
    </span>
